<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a89878;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8b89a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#tileGrad)" stroke-width="2"/>
  
  <!-- Tile pattern - geometric squares -->
  <g fill="url(#tileGrad)">
    <!-- Top-left tile -->
    <rect x="40" y="40" width="35" height="35" rx="2"/>
    <!-- Top-right tile -->
    <rect x="125" y="40" width="35" height="35" rx="2"/>
    <!-- Middle-center tile (larger) -->
    <rect x="75" y="75" width="50" height="50" rx="3" fill="#a89878" opacity="0.8"/>
    <!-- Bottom-left tile -->
    <rect x="40" y="125" width="35" height="35" rx="2"/>
    <!-- Bottom-right tile -->
    <rect x="125" y="125" width="35" height="35" rx="2"/>
  </g>
  
  <!-- Accent lines for modernness -->
  <g stroke="#c8b89a" stroke-width="2" fill="none" opacity="0.6">
    <line x1="55" y1="85" x2="85" y2="85"/>
    <line x1="115" y1="115" x2="145" y2="115"/>
  </g>
  
  <!-- Center diamond highlight -->
  <circle cx="100" cy="100" r="15" fill="none" stroke="#e8dcc8" stroke-width="1.5" opacity="0.7"/>
</svg>